name: Deploy nekogaku.com to Cloudflare Workers

on:
  push:
    branches:
      - v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nekogaku-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/v1'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install font tools
        run: python -m pip install fonttools==4.68.0 brotli==1.2.1

      - name: Install dependencies
        env:
          HUSKY: "0"
        run: bun install --frozen-lockfile

      - name: Build production site
        env:
          NEXT_PUBLIC_TINA_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_TINA_CLIENT_ID }}
          TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
          NEXT_PUBLIC_TINA_BRANCH: v1
          TINA_PUBLIC_IS_LOCAL: "false"
          NAVFOLIO_DEPLOY_TARGET: cloudflare
          SITE_URL: https://nekogaku.com
          SITE_BASE: /
        run: |
          ./node_modules/.bin/tinacms build --skip-cloud-checks
          bun run fonts:ui
          ./node_modules/.bin/astro build
          ./node_modules/.bin/pagefind --site dist/client --output-subdir pagefind --root-selector main --exclude-selectors "[data-pagefind-ignore]"

      - name: Verify production build
        run: |
          test -f dist/server/entry.mjs
          test -f dist/client/admin/index.html
          test -d dist/client/pagefind
          python -c "import json; from pathlib import Path; p=Path(\"dist/server/wrangler.json\"); d=json.loads(p.read_text()); assert d.get(\"name\")==\"astro-navfolio\"; d.pop(\"route\",None); d[\"routes\"]=[{\"pattern\":\"nekogaku.com\",\"custom_domain\":True}]; d[\"workers_dev\"]=True; d[\"preview_urls\"]=True; bindings=d.get(\"kv_namespaces\",[]); session=[x for x in bindings if x.get(\"binding\")==\"SESSION\"]; assert len(session)==1; session[0][\"id\"]=\"30eb28be2df34038827ded023e8c89a3\"; p.write_text(json.dumps(d,indent=2)+chr(10)); print(\"PASS: Production domain and SESSION binding verified\")"

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run wrangler deploy --config dist/server/wrangler.json

      - name: Verify public site
        run: |
          curl --fail --silent --show-error --location --retry 3 https://nekogaku.com/ -o /tmp/nekogaku-home.html
          curl --fail --silent --show-error --location --retry 3 https://nekogaku.com/blog/ -o /tmp/nekogaku-blog.html
          echo "SUCCESS: nekogaku.com deployed"
